<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="dashboard-snapshot" content="/data.json">
<title>香港天氣與空氣質素</title>
<style>
  :root { color-scheme: light; font: 15px/1.5 system-ui,sans-serif; color:#172d3b; background:#eef3f4; --ink:#172d3b; --muted:#526e77; --stroke:#d5e2e3; --teal:#076d68 }
  html { scroll-padding-top:calc(var(--header-height, 80px) + 10px) }
  * { box-sizing:border-box }
  body { margin:0 }
  header { position:sticky; top:0; z-index:10; background:#103a47; color:white; padding:7px max(16px,calc((100vw - 1240px)/2)); display:flex; justify-content:space-between; align-items:center; gap:6px 20px; flex-wrap:wrap }
  .header-title { display:flex; align-items:center; gap:10px; min-width:0 }
  h1 { font-size:clamp(17px,2vw,22px); line-height:1.15; margin:0 }
  .header-sources { display:grid; flex:none; color:#c7e4e5; font-size:11px; line-height:1.2; white-space:nowrap }
  p { margin:4px 0 }
  main { max-width:1280px; margin:auto; padding:20px }
  section { background:#fff; border:1px solid var(--stroke); border-radius:14px; padding:20px; min-width:0 }
  h2 { font-size:19px; margin:0 }
  h3 { font-size:14px; margin:0 0 3px }
  .top,.row { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap }
  .subtle { color:var(--muted); font-size:13px }
  .grid { display:grid; grid-template-columns:1.35fr 1fr; gap:16px; align-items:start }
  .stack { display:grid; gap:16px }
  #notice { min-height:23px; margin:0 0 9px; color:var(--muted) }
  select { padding:7px 9px; font:inherit; background:#fff; color:var(--ink); border:1px solid #b3c6cc; border-radius:7px }
  .controls { display:flex; flex-wrap:wrap; gap:5px 14px }
  header label { display:flex; align-items:center; gap:6px; font-size:13px }
  header select { padding:4px 8px }
  #station-select { min-width:9em }
  #map { position:relative; height:clamp(260px,34vw,425px); border-radius:9px; background:#e6f1f4; overflow:hidden; margin:12px 0 7px }
  canvas { display:block; width:100%; height:100% }
  .marker { position:absolute; transform:translate(-50%,-50%); padding:0; width:23px; height:23px; border-radius:50%; border:1px solid white; background:var(--risk); color:white; font:bold 11px system-ui; cursor:pointer; box-shadow:0 1px 3px #15374860 }
  .marker.roadside { border-radius:5px }
  .marker[aria-pressed="true"] { outline:2px solid #172d3b; outline-offset:2px; z-index:1 }
  .legend { display:flex; flex-wrap:wrap; gap:10px; margin:9px 0; font-size:12px }
  .legend span { display:inline-flex; align-items:center; gap:4px }
  .dot { width:9px; height:9px; border-radius:50%; display:inline-block; background:var(--risk); flex:none }
  #stations { max-height:385px; overflow:auto; margin-top:10px }
  table { width:100%; border-collapse:collapse; font-size:13px }
  th,td { text-align:left; border-bottom:1px solid #e8eeee; padding:7px 6px }
  th:last-child,td:last-child { text-align:right }
  tr:has(button[aria-pressed="true"]) { background:#e5f3f1 }
  .station { font:inherit; color:var(--teal); text-align:left; padding:0; border:0; background:none; cursor:pointer }
  .value { display:inline-flex; align-items:center; gap:5px; font-weight:bold }
  .plot { position:relative; height:116px }
  .chart { margin-top:12px }
  .chart + .chart { border-top:1px solid #e8eeee; padding-top:10px }
  #analysis { margin-top:16px }
  .analysis-plots { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:20px; margin-top:12px }
  .analysis-plots .plot { height:290px }
  .analysis-plots label { display:flex; align-items:center; gap:8px }
  .analysis-plots input { width:clamp(120px,40vw,200px); accent-color:var(--teal) }
  .analysis-plots output { min-width:3em; font-variant-numeric:tabular-nums }
  #analysis-results { margin-top:10px }
  #analysis-results td:not(:first-child),#analysis-results th:not(:first-child) { text-align:right; font-variant-numeric:tabular-nums }
  #analysis details { margin-top:10px }
  #analysis summary { width:fit-content; cursor:pointer }
  .tooltip { position:absolute; z-index:2; pointer-events:none; background:#103a47; color:white; border-radius:6px; padding:6px 8px; font-size:12px; max-width:200px }
  a { color:var(--teal) }
  [hidden] { display:none !important }
  @media (max-width:840px) { .grid,.analysis-plots { grid-template-columns:1fr } }
  @media (max-width:640px) {
    header { display:grid; grid-template-columns:minmax(0,1fr) auto; grid-template-areas:"title language" "station range"; padding:6px 12px; gap:4px 8px }
    .header-title { grid-area:title; gap:6px }
    header h1 { font-size:clamp(14px,4.5vw,17px) }
    header .controls { display:contents }
    header label[for="station-select"] { grid-area:station }
    header label[for="hours"] { grid-area:range }
    header label[for="language"] { grid-area:language; justify-content:flex-end }
    header label > span { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap }
    header select { padding:4px 6px; min-width:0; max-width:100% }
    #station-select { min-width:0; width:100% }
    #hours { width:100% }
  }
  @media (max-width:480px) { main, section { padding:13px } th,td { padding:6px 3px } }
</style>
</head>
<body>
<header>
  <div class="header-title">
    <h1 data-text="title">香港天氣與空氣質素</h1>
    <div class="header-sources"><span data-text="agencyEpd">環境保護署</span><span data-text="agencyHko">香港天文台</span></div>
  </div>
  <div class="controls">
    <label for="station-select"><span data-text="station">站點</span> <select id="station-select" aria-label="選擇監測站" data-label="selectStation" disabled></select></label>
    <label for="hours"><span data-text="range">時間範圍</span> <select id="hours"><option value="24" data-text="last24">近 24 小時</option><option value="36" data-text="last36">近 36 小時</option><option value="48" data-text="last48">近 48 小時</option><option value="72" data-text="last72">近 72 小時</option><option value="168" data-text="last7Days">近 7 天</option><option value="720" data-text="last30Days">近 30 天</option></select></label>
    <label for="language"><span data-text="language">語言</span> <select id="language"><option value="zh-Hant" lang="zh-Hant">繁體中文</option><option value="zh-Hans" lang="zh-Hans">简体中文</option><option value="en" lang="en">English</option></select></label>
  </div>
</header>
<main>
  <p id="notice" role="status">正在讀取資料…</p>
  <div class="grid">
    <div class="stack">
      <section aria-labelledby="map-title">
        <div class="top"><h2 id="map-title" data-text="map">AQHI 監測站地圖</h2><span id="coverage" class="subtle"></span></div>
        <div id="map"><canvas aria-hidden="true"></canvas></div>
        <div id="legend" class="legend" aria-label="AQHI 風險級別" data-label="risk"></div>
        <p class="subtle" data-text="mapHint">圓形為一般站，方形為路邊站。點選任何一站查看 AQHI、氣溫和雨量。</p>
        <p class="subtle"><span data-text="mapData">地圖資料：</span><a data-text="epdSource" href="https://portal.csdi.gov.hk/csdi-webpage/dataset/epd_rcd_1629267205214_40635">環保署監測站</a> · <a data-text="boundaries" href="https://portal.csdi.gov.hk/csdi-webpage/dataset/had_rcd_1634523272907_75218">民政事務總署地界</a></p>
      </section>
      <section>
        <div class="top"><h2 data-text="latest">各站最新讀數</h2><span id="latest" class="subtle"></span></div>
        <div id="stations"><table>
          <thead><tr><th scope="col" data-text="station">站點</th><th scope="col" data-text="type">類型</th><th scope="col">AQHI</th></tr></thead>
          <tbody id="station-rows"></tbody>
        </table></div>
      </section>
    </div>
    <section aria-labelledby="trends-title">
      <h2 id="trends-title" data-text="trends">觀測趨勢</h2>
      <p id="sources" class="subtle"></p>
      <div class="chart" id="air-chart"><div class="row"><h3>AQHI</h3><strong class="reading"></strong></div><div class="plot"><canvas aria-label="AQHI 時間序列" data-label="airSeries" role="img"></canvas><div class="tooltip" hidden></div></div></div>
      <div class="chart" id="temp-chart"><div class="row"><h3 data-text="temperature">氣溫（°C）</h3><strong class="reading"></strong></div><div class="plot"><canvas aria-label="氣溫時間序列" data-label="temperatureSeries" role="img"></canvas><div class="tooltip" hidden></div></div></div>
      <div class="chart" id="rain-chart"><div class="row"><h3 data-text="rainfall">分區時段最大雨量（mm）</h3><strong class="reading"></strong></div><div class="plot"><canvas aria-label="分區時段最大雨量時間序列" data-label="rainfallSeries" role="img"></canvas><div class="tooltip" hidden></div></div></div>
      <p class="subtle" data-text="trendHint">氣溫取自距離所選 AQHI 站最近的天文台氣溫測點，距離按直線計算。雨量取自該 AQHI 站所在行政區。</p>
    </section>
  </div>
  <section id="analysis" aria-labelledby="analysis-title">
    <div class="top"><h2 id="analysis-title" data-text="analysis">關聯分析</h2><span id="analysis-station" class="subtle"></span></div>
    <div class="analysis-plots">
      <div>
        <div class="row"><h3 data-text="tempAir">氣溫與 AQHI</h3></div>
        <div class="plot" id="temperature-scatter"><canvas role="img" aria-label="氣溫與 AQHI 散點圖" data-label="tempAir"></canvas><div class="tooltip" hidden></div></div>
      </div>
      <div>
        <div class="row"><h3 data-text="threeAxis">氣溫、AQHI 與雨量</h3><span id="complete-hours" class="subtle"></span></div>
        <div class="plot" id="weather-scatter"><canvas role="img" aria-label="氣溫、AQHI 與雨量三維散點圖" data-label="threeAxis"></canvas><div class="tooltip" hidden></div></div>
        <label class="subtle"><span data-text="rotate">旋轉視角</span><input id="analysis-rotation" type="range" min="0" max="360" value="42"><output id="analysis-angle" for="analysis-rotation" aria-hidden="true">42°</output></label>
      </div>
    </div>
    <table id="analysis-results" aria-labelledby="analysis-title">
      <thead><tr><th scope="col" data-text="pair">指標組合</th><th scope="col">Spearman ρ</th><th scope="col" data-text="pairedHours">有效配對數</th></tr></thead>
      <tbody></tbody>
    </table>
    <details class="subtle"><summary data-text="analysisMethod">配對及計算方法</summary><p data-text="analysisAlignment"></p><p data-text="analysisLimits"></p></details>
  </section>
</main>
<script>
"use strict";
const $ = id => document.getElementById(id);
const snapshotUrl = document.querySelector('meta[name="dashboard-snapshot"]').content;
const languages = ["zh-Hant", "zh-Hans", "en"];
const messages = {
  title: ["香港天氣與空氣質素", "香港天气与空气质量", "Hong Kong Weather and Air Quality"],
  agencyEpd: ["環境保護署", "环境保护署", "EPD"],
  agencyHko: ["香港天文台", "香港天文台", "HKO"],
  language: ["語言", "语言", "Language"],
  range: ["時間範圍", "时间范围", "Time range"],
  last24: ["近 24 小時", "近 24 小时", "Last 24 hours"],
  last36: ["近 36 小時", "近 36 小时", "Last 36 hours"],
  last48: ["近 48 小時", "近 48 小时", "Last 48 hours"],
  last72: ["近 72 小時", "近 72 小时", "Last 72 hours"],
  last7Days: ["近 7 天", "近 7 天", "Last 7 days"],
  last30Days: ["近 30 天", "近 30 天", "Last 30 days"],
  loading: ["正在讀取資料…", "正在读取数据…", "Loading data…"],
  map: ["AQHI 監測站地圖", "AQHI 监测站地图", "AQHI Station Map"],
  risk: ["AQHI 風險級別", "AQHI 风险级别", "AQHI risk levels"],
  mapHint: [
    "圓形為一般站，方形為路邊站。點選任何一站查看 AQHI、氣溫和雨量。",
    "圆形为一般站，方形为路边站。点击任一站查看 AQHI、气温和雨量。",
    "Circles show general stations and squares show roadside stations. Select a station for AQHI, temperature and rainfall.",
  ],
  mapData: ["地圖資料：", "地图数据：", "Map data: "],
  epdSource: ["環保署監測站", "环保署监测站", "EPD monitoring stations"],
  boundaries: ["民政事務總署地界", "民政事务总署地界", "Home Affairs Department boundaries"],
  latest: ["各站最新讀數", "各站最新读数", "Latest Station Readings"],
  station: ["站點", "站点", "Station"],
  type: ["類型", "类型", "Type"],
  trends: ["觀測趨勢", "观测趋势", "Observation Trends"],
  selectStation: ["選擇監測站", "选择监测站", "Select a monitoring station"],
  temperature: ["氣溫（°C）", "气温（°C）", "Temperature (°C)"],
  rainfall: ["分區時段最大雨量（mm）", "分区时段最大雨量（mm）", "District Maximum Rainfall per Period (mm)"],
  airSeries: ["AQHI 時間序列", "AQHI 时间序列", "AQHI time series"],
  temperatureSeries: ["氣溫時間序列", "气温时间序列", "Temperature time series"],
  rainfallSeries: ["分區時段最大雨量時間序列", "分区时段最大雨量时间序列", "District maximum rainfall time series"],
  trendHint: [
    "氣溫取自距離所選 AQHI 站最近的天文台氣溫測點，距離按直線計算。雨量取自該 AQHI 站所在行政區。",
    "气温取自距离所选 AQHI 站最近的天文台气温测点，距离按直线计算。雨量取自该 AQHI 站所在行政区。",
    "Temperature comes from the Observatory site closest to the selected AQHI station, using straight-line distance. Rainfall comes from that station’s district.",
  ],
  coverage: ["{valid} / {total} 站有讀數", "{valid} / {total} 站有读数", "{valid} / {total} stations reporting"],
  waiting: ["等待首輪 AQHI 資料", "等待首轮 AQHI 数据", "Waiting for the first AQHI readings"],
  timestamp: ["{time} 香港時間", "{time} 香港时间", "{time} Hong Kong time"],
  general: ["一般站", "一般站", "General"],
  roadside: ["路邊站", "路边站", "Roadside"],
  low: ["低", "低", "Low"],
  moderate: ["中", "中", "Moderate"],
  high: ["高", "高", "High"],
  veryHigh: ["甚高", "甚高", "Very high"],
  serious: ["嚴重", "严重", "Serious"],
  missing: ["缺測", "缺测", "No reading"],
  noReadings: ["這段時間沒有有效讀數", "这段时间没有有效读数", "No readings in this period"],
  interval: ["{start} 至 {end}", "{start} 至 {end}", "{start} to {end}"],
  window: ["香港時間 {interval}", "香港时间 {interval}", "Hong Kong time {interval}"],
  retry: ["暫時無法讀取資料，稍後會自動重試。", "暂时无法读取数据，稍后会自动重试。", "Data is temporarily unavailable. Retrying automatically."],
  stale: ["目前顯示 {time} 的快照。", "目前显示 {time} 的快照。", "Showing the snapshot from {time}."],
  sources: [
    "AQHI：{station} · 氣溫：{temperature}（約 {km} km） · 雨量：{rainfall}",
    "AQHI：{station} · 气温：{temperature}（约 {km} km） · 雨量：{rainfall}",
    "AQHI: {station} · Temperature: {temperature} (about {km} km away) · Rainfall: {rainfall}",
  ],
  analysis: ["關聯分析", "关联分析", "Relationship analysis"],
  tempAir: ["氣溫與 AQHI", "气温与 AQHI", "Temperature and AQHI"],
  rainAir: ["雨量與 AQHI", "雨量与 AQHI", "Rainfall and AQHI"],
  tempRain: ["氣溫與雨量", "气温与雨量", "Temperature and rainfall"],
  threeAxis: ["氣溫、AQHI 與雨量", "气温、AQHI 与雨量", "Temperature, AQHI and rainfall"],
  rainAxis: ["雨量 (mm)", "雨量 (mm)", "Rainfall (mm)"],
  rotate: ["旋轉視角", "旋转视角", "Rotate"],
  pair: ["指標組合", "指标组合", "Variable pair"],
  pairedHours: ["有效配對數", "有效配对数", "Paired hours"],
  completeHours: ["{count} 個完整小時", "{count} 个完整小时", "{count} complete hours"],
  overlappingHours: ["{count} 個小時的讀數重疊", "{count} 个小时的读数重叠", "{count} hours with the same readings"],
  analysisMethod: ["配對及計算方法", "配对及计算方法", "Pairing and calculation"],
  analysisAlignment: [
    "以 AQHI 觀測小時為基準，配對同一時刻的氣溫，以及提前 15 分鐘結束的一小時分區最大雨量。缺測略過，0 mm 計入。重疊讀數以較大的點表示。",
    "以 AQHI 观测小时为基准，配对同一时刻的气温，以及提前 15 分钟结束的一小时分区最大雨量。缺测略过，0 mm 计入。重叠读数以较大的点表示。",
    "Each AQHI hour is matched with temperature at that time and the district’s one-hour rainfall maximum ending 15 minutes earlier. Missing readings are skipped, and 0 mm counts. Larger points represent repeated readings.",
  ],
  analysisLimits: [
    "相關係數按組合各自計算。少於 3 組或任一指標沒有變化時顯示 —。相關性不能據此推斷因果。",
    "相关系数按组合各自计算。少于 3 组或任一指标没有变化时显示 —。相关性不能据此推断因果。",
    "Spearman ρ is calculated for each pair. A dash indicates fewer than three pairs or a constant variable. Correlation alone cannot establish causation.",
  ],
};
const stationNames = {
  "0": ["中西区", "Central & Western"], "1": ["南区", "Southern"], "2": ["东区", "Eastern"],
  "3": ["观塘", "Kwun Tong"], "4": ["深水埗", "Sham Shui Po"], "5": ["葵涌", "Kwai Chung"],
  "6": ["荃湾", "Tsuen Wan"], "7": ["将军澳", "Tseung Kwan O"], "8": ["元朗", "Yuen Long"],
  "9": ["屯门", "Tuen Mun"], "10": ["东涌", "Tung Chung"], "11": ["大埔", "Tai Po"],
  "12": ["沙田", "Sha Tin"], "13": ["北区", "North"], "14": ["塔门", "Tap Mun"],
  "15": ["铜锣湾", "Causeway Bay"], "16": ["中环", "Central"], "17": ["旺角", "Mong Kok"],
};
const locationNames = {
  "Hong Kong Park": ["香港公園", "香港公园"], "Wong Chuk Hang": ["黃竹坑", "黄竹坑"],
  "Shau Kei Wan": ["筲箕灣", "筲箕湾"], "Kwun Tong": ["觀塘", "观塘"], "Sham Shui Po": ["深水埗", "深水埗"],
  "Tsuen Wan Shing Mun Valley": ["荃灣城門谷", "荃湾城门谷"], "Tseung Kwan O": ["將軍澳", "将军澳"],
  "Yuen Long Park": ["元朗公園", "元朗公园"], "Tuen Mun": ["屯門", "屯门"], "Chek Lap Kok": ["赤鱲角", "赤鱲角"],
  "Tai Po": ["大埔", "大埔"], "Sha Tin": ["沙田", "沙田"], "Ta Kwu Ling": ["打鼓嶺", "打鼓岭"],
  "Tai Mei Tuk": ["大美督", "大美督"], "Happy Valley": ["跑馬地", "跑马地"], "King's Park": ["京士柏", "京士柏"],
  "Central & Western District": ["中西區", "中西区"], "Southern District": ["南區", "南区"],
  "Eastern District": ["東區", "东区"], "Kwai Tsing": ["葵青", "葵青"], "Tsuen Wan": ["荃灣", "荃湾"],
  "Sai Kung": ["西貢", "西贡"], "Yuen Long": ["元朗", "元朗"], "Islands District": ["離島區", "离岛区"],
  "Lau Fau Shan": ["流浮山", "流浮山"], "Cheung Chau": ["長洲", "长洲"],
  "Tsing Yi": ["青衣", "青衣"], "Shek Kong": ["石崗", "石岗"], "Tsuen Wan Ho Koon": ["荃灣可觀", "荃湾可观"],
  "Kowloon City": ["九龍城", "九龙城"], "Wong Tai Sin": ["黃大仙", "黄大仙"], "Stanley": ["赤柱", "赤柱"],
  "Kai Tak Runway Park": ["啟德跑道公園", "启德跑道公园"], "Hong Kong Observatory": ["香港天文台", "香港天文台"],
  "North District": ["北區", "北区"], "Wan Chai": ["灣仔", "湾仔"], "Yau Tsim Mong": ["油尖旺", "油尖旺"],
};
let languageIndex = 0;
let hk;
const t = (key, values) => messages[key][languageIndex].replace(/\{(\w+)\}/g, (_, name) => values[name]);
const time = value => hk.format(new Date(value));
const interval = (start, end) => t("interval", { start: time(start), end: time(end) });
const stationName = station => stationNames[station.id]?.[languageIndex - 1] ?? station.label;
const locationName = name => locationNames[name]?.[languageIndex] ?? name;
const levels = [
  ["low","#206c5b"], ["moderate","#806006"], ["high","#a54914"],
  ["veryHigh","#a52635"], ["serious","#633a80"], ["missing","#627882"],
];
const score = raw => raw === null || raw === undefined ? null : raw === "10+" ? 11 : Number(raw);
function level(raw) {
  const n = score(raw);
  if (n === null) return 5;
  return n <= 3 ? 0 : n <= 6 ? 1 : n === 7 ? 2 : n <= 10 ? 3 : 4;
}
function element(tag, content, className) {
  const el = document.createElement(tag);
  if (content !== undefined) el.textContent = content;
  if (className) el.className = className;
  return el;
}
function setup(canvas) {
  const width = canvas.clientWidth;
  const height = canvas.clientHeight;
  const ratio = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = width * ratio;
  canvas.height = height * ratio;
  const ctx = canvas.getContext("2d");
  ctx.scale(ratio, ratio);
  return { width, height, ctx };
}

let allData;
let data;
let stationId = "12";
let latestRows = new Map();
let pending;
let loadFailed = false;
let completeAnalysis = [];
const markerNodes = new Map();
const tableBody = $("station-rows");
const select = $("station-select");
const hours = $("hours");
const map = $("map");
const mapCanvas = map.querySelector("canvas");

function applyLanguage(requested) {
  languageIndex = Math.max(0, languages.indexOf(requested));
  const language = languages[languageIndex];
  $("language").value = language;
  document.documentElement.lang = language;
  document.title = t("title");
  hk = new Intl.DateTimeFormat(language + "-HK", {
    timeZone:"Asia/Hong_Kong", month:"numeric", day:"numeric", hour:"2-digit", minute:"2-digit", hourCycle:"h23",
  });
  for (const item of document.querySelectorAll("[data-text]")) item.textContent = t(item.dataset.text);
  for (const item of document.querySelectorAll("[data-label]")) item.setAttribute("aria-label", t(item.dataset.label));
  $("legend").replaceChildren();
  for (const [key, color] of levels) {
    const entry = element("span");
    const dot = element("i", "", "dot");
    dot.style.setProperty("--risk", color);
    entry.append(dot, document.createTextNode(t(key)));
    $("legend").append(entry);
  }
  render();
}

function isRoadside(station) {
  return latestRows.get(station.id)?.payload.stationType === "roadside" || station.type === "roadside";
}
function selectStation(id) {
  stationId = id;
  select.value = id;
  for (const button of document.querySelectorAll("button[data-station]")) {
    button.setAttribute("aria-pressed", String(button.dataset.station === id));
  }
  drawTrends();
}
function buildStations() {
  const received = latestRows.size;
  const valid = [...latestRows.values()].filter(row => row.payload.value !== null).length;
  $("coverage").textContent = received ? t("coverage", { valid, total: data.stations.length }) : t("waiting");
  const updated = [...latestRows.values()][0]?.observedAt;
  $("latest").textContent = updated ? t("timestamp", { time: time(updated) }) : "";
  for (const item of markerNodes.values()) item.remove();
  markerNodes.clear();
  const options = data.stations.map(station => [station.id, stationName(station)]);
  if (select.options.length !== options.length || options.some(([id, name], i) =>
    select.options[i].value !== id || select.options[i].text !== name)) {
    select.replaceChildren(...options.map(([id, name]) => new Option(name, id)));
  }
  select.disabled = !options.length;
  tableBody.replaceChildren();
  for (const station of data.stations) {
    const value = latestRows.get(station.id)?.payload.value ?? null;
    const roadside = isRoadside(station);
    const type = t(roadside ? "roadside" : "general");
    const label = stationName(station);
    const marker = element("button", value ?? "—", "marker" + (roadside ? " roadside" : ""));
    marker.dataset.station = station.id;
    marker.style.setProperty("--risk", levels[level(value)][1]);
    marker.title = label + " · " + type + " · AQHI " + (value ?? t("missing"));
    marker.setAttribute("aria-label", marker.title);
    marker.addEventListener("click", () => selectStation(station.id));
    markerNodes.set(station.id, marker);
    map.append(marker);
    const tr = element("tr");
    const button = element("button", label, "station");
    button.dataset.station = station.id;
    button.addEventListener("click", () => selectStation(station.id));
    const name = element("td");
    name.append(button);
    const reading = element("td", value ?? "—");
    reading.style.color = levels[level(value)][1];
    tr.append(name, element("td", type), reading);
    tableBody.append(tr);
  }
}

function drawMap() {
  if (!data) return;
  const { ctx, width, height } = setup(mapCanvas);
  const west=113.82, east=114.45, south=22.14, north=22.57;
  const scale = Math.min((width-20)/(east-west), (height-20)/(north-south));
  const project = (lon, lat) => [width/2+(lon-(west+east)/2)*scale, height/2-((lat-(south+north)/2)*scale)];
  ctx.fillStyle="#cddfdd";
  ctx.strokeStyle="#94b7b6";
  ctx.lineWidth=1;
  for (const district of data.districts) {
    ctx.beginPath();
    for (const ring of district) {
      ring.forEach(([lon,lat], index) => {
        const [x,y] = project(lon,lat);
        if (index) ctx.lineTo(x,y); else ctx.moveTo(x,y);
      });
      ctx.closePath();
    }
    ctx.fill("evenodd");
    ctx.stroke();
  }
  for (const station of data.stations) {
    const marker = markerNodes.get(station.id);
    if (!marker) continue;
    const [x,y] = project(station.longitude,station.latitude);
    marker.style.left=x+"px";
    marker.style.top=y+"px";
  }
}

function drawChart(id, values, config) {
  const panel = $(id);
  const canvas = panel.querySelector("canvas");
  const info = panel.querySelector(".tooltip");
  panel.querySelector(".reading").textContent = values.at(-1)?.label ?? "—";
  info.hidden = true;
  const { ctx,width,height } = setup(canvas);
  const plotted = values.filter(row => row.value !== null);
  if (!plotted.length) {
    ctx.fillStyle="#526e77";
    ctx.font="13px system-ui";
    ctx.fillText(t("noReadings"), 10, height/2);
    canvas.onpointermove=null;
    return;
  }

  const minValue = Math.min(...plotted.map(p => p.value));
  const maxValue = Math.max(...plotted.map(p => p.value));
  const [min,max] = config.bounds ?? [Math.floor(minValue)-1,Math.ceil(maxValue)+1];
  const start = Date.parse(data.since), end = Date.parse(data.until);
  const left=35, right=width-12, top=12, bottom=height-22;
  const x = t => left + (t-start)/(end-start)*(right-left);
  const y = v => bottom - (v-min)/(max-min)*(bottom-top);
  ctx.font="10px system-ui";
  ctx.fillStyle="#526e77";
  ctx.strokeStyle="#e1eaeb";
  for (const tick of config.ticks ?? [min,(min+max)/2,max]) {
    const ht=y(tick);
    const axisLabel=tick===11 && id==="air-chart" ? "10+" : String(Math.round(tick*10)/10);
    ctx.fillText(axisLabel, 2, ht+3);
    ctx.beginPath(); ctx.moveTo(left,ht); ctx.lineTo(right,ht); ctx.stroke();
  }
  const xTicks = width > 415 ? [0,1/3,2/3,1] : [0,0.5,1];
  for (const part of xTicks) {
    const label = time(start + part * (end - start));
    const point=left+part*(right-left);
    ctx.fillText(label,Math.max(1,Math.min(point-ctx.measureText(label).width/2,width-ctx.measureText(label).width-1)),height-4);
  }
  ctx.strokeStyle=config.color;
  ctx.fillStyle=config.color;
  ctx.lineWidth=2;
  let previous;
  for (const row of values) {
    if (row.value === null) { previous=undefined; continue; }
    const t=Date.parse(row.observedAt);
    if (config.connect && previous && t-Date.parse(previous.observedAt) <= 90*60_000) {
      ctx.beginPath(); ctx.moveTo(x(Date.parse(previous.observedAt)),y(previous.value)); ctx.lineTo(x(t),y(row.value)); ctx.stroke();
    }
    ctx.beginPath();
    ctx.arc(x(t), y(row.value), 2.4, 0, Math.PI * 2);
    ctx.fill();
    previous=row;
  }
  canvas.onpointermove = event => {
    const offset=event.clientX-canvas.getBoundingClientRect().left;
    const nearby=plotted.reduce((best,row) => Math.abs(x(Date.parse(row.observedAt))-offset) < Math.abs(x(Date.parse(best.observedAt))-offset) ? row : best);
    const distance=Math.abs(x(Date.parse(nearby.observedAt))-offset);
    info.hidden=distance>14;
    if (!info.hidden) {
      const observed = nearby.periodStart ? interval(nearby.periodStart, nearby.observedAt) : time(nearby.observedAt);
      info.textContent=observed+" · "+nearby.label;
      info.style.left=Math.max(0,Math.min(offset+9,width-205))+"px";
      info.style.top="0";
    }
  };
  canvas.onpointerleave=() => { info.hidden=true; };
}
function analysisHours(air, temperature, rain) {
  const temperatureAt = new Map(temperature.filter(row => Number.isFinite(row.value))
    .map(row => [Date.parse(row.observedAt), row.value]));
  const rainAt = new Map();
  for (const row of rain) {
    const end = Date.parse(row.observedAt);
    if (end - Date.parse(row.periodStart) === 3600_000 && Number.isFinite(row.value)) {
      rainAt.set(end, row.value);
    }
  }
  const aqhiAt = new Map();
  for (const row of air) {
    const hour = Date.parse(row.observedAt);
    if (hour % 3600_000 === 0 && (!aqhiAt.has(hour) || Number.isFinite(row.value))) {
      aqhiAt.set(hour, row.value);
    }
  }
  return [...aqhiAt].map(([hour, aqhi]) => ({
    hour, aqhi, temperature: temperatureAt.get(hour), rain: rainAt.get(hour - 15 * 60_000),
  }));
}

function ranks(values) {
  const sorted = values.map((value, index) => ({ value, index })).sort((a, b) => a.value - b.value);
  const output = new Array(values.length);
  for (let start = 0; start < sorted.length;) {
    let end = start + 1;
    while (end < sorted.length && sorted[end].value === sorted[start].value) end++;
    const average = (start + end + 1) / 2;
    for (let i = start; i < end; i++) output[sorted[i].index] = average;
    start = end;
  }
  return output;
}

function spearman(rows, xKey, yKey) {
  if (rows.length < 3) return null;
  const xs = ranks(rows.map(row => row[xKey]));
  const ys = ranks(rows.map(row => row[yKey]));
  const mean = (rows.length + 1) / 2;
  let covariance = 0, squareX = 0, squareY = 0;
  for (let i = 0; i < rows.length; i++) {
    const dx = xs[i] - mean, dy = ys[i] - mean;
    covariance += dx * dy;
    squareX += dx * dx;
    squareY += dy * dy;
  }
  return squareX && squareY ? covariance / Math.sqrt(squareX * squareY) : null;
}

function drawScatter(id, rows, threeAxes = false) {
  const plot = $(id);
  const canvas = plot.querySelector("canvas");
  const info = plot.querySelector(".tooltip");
  info.hidden = true;
  const { ctx, width, height } = setup(canvas);
  ctx.font = "12px system-ui";
  ctx.fillStyle = "#526e77";
  if (!rows.length) {
    ctx.fillText(t("noReadings"), 10, height / 2);
    canvas.onpointermove = null;
    return;
  }

  const temperatures = rows.map(row => row.temperature);
  const min = Math.floor(Math.min(...temperatures)) - 1;
  const max = Math.ceil(Math.max(...temperatures)) + 1;
  const rainMax = threeAxes ? Math.max(1, Math.ceil(Math.max(...rows.map(row => row.rain)))) : 1;
  const left = threeAxes ? width / 2 : 42, right = width - 22;
  const bottom = height - (threeAxes ? 80 : 54);
  const up = height - (threeAxes ? 148 : 87);
  const angle = threeAxes ? (Number($("analysis-rotation").value) % 360) * Math.PI / 180 : 0;
  const sine = Math.sin(angle), cosine = Math.cos(angle);
  // Keep the far corner inside the plot throughout a full turn.
  const radius = Math.max(1, width / 2 - 24);
  const temperatureSpan = threeAxes ? radius * .84 : right - left;
  const rainSpan = threeAxes ? radius * .53 : 0;
  const pitch = threeAxes ? Math.min(.30, 38 / radius) : 0;
  const project = (temperature, aqhi, rain = 0) => {
    const x = temperatureSpan * (temperature - min) / (max - min);
    const z = rainSpan * rain / rainMax;
    return [
      left + x * cosine - z * sine,
      bottom - up * (aqhi - 1) / 10 - pitch * (x * sine + z * cosine),
    ];
  };
  const line = (start, end, color = "#94a8ad") => {
    ctx.strokeStyle = color;
    ctx.beginPath(); ctx.moveTo(...start); ctx.lineTo(...end); ctx.stroke();
  };
  const label = (value, x, y, align = "left") => {
    ctx.textAlign = align;
    ctx.fillStyle = "#526e77";
    ctx.fillText(value, x, y);
  };
  const origin = project(min, 1);
  for (const aqhi of [1, 3, 6, 8, 11]) {
    const start = project(min, aqhi);
    line(start, project(max, aqhi), "#e1eaeb");
    label(aqhi === 11 ? "10+" : aqhi, start[0] - 7, start[1] + 4, "right");
  }
  const temperatureAxisWidth = Math.abs(project(max, 1)[0] - origin[0]);
  const tickCount = threeAxes ? Math.min(5, Math.max(1, Math.floor(temperatureAxisWidth / 35))) : (width < 380 ? 3 : 5);
  const tickStep = Math.max(1, Math.ceil((max - min) / tickCount));
  for (let temperature = min; temperature <= max; temperature += tickStep) {
    if (threeAxes && temperatureAxisWidth < 30 && temperature === min) continue;
    const [x, y] = project(temperature, 1);
    if (threeAxes && temperatureAxisWidth < 30) label(temperature, x + 8, y + 13);
    else label(temperature, x, y + 18, "center");
  }
  line(origin, project(min, 11));
  line(origin, project(max, 1));
  label("AQHI", left, bottom - up - 10, "center");
  label(t("temperature"), project((min + max) / 2, 1)[0], height - 8, "center");
  if (threeAxes) {
    const [x, y] = project(min, 1, rainMax);
    line(origin, [x, y]);
    line([x, y], project(max, 1, rainMax), "#e1eaeb");
    line(project(max, 1), project(max, 1, rainMax), "#e1eaeb");
    const onLeft = x < left;
    label(rainMax, x + (onLeft ? -7 : 7), y + 4, onLeft ? "right" : "left");
    const rainLabel = t("rainAxis");
    const labelWidth = ctx.measureText(rainLabel).width;
    const labelX = onLeft ? x - 6 - labelWidth : x + 6;
    label(rainLabel, Math.max(4, Math.min(labelX, width - labelWidth - 4)), y + 21);
  }

  const groups = new Map();
  for (const row of rows) {
    const rain = threeAxes ? row.rain : 0;
    const key = JSON.stringify([row.temperature, row.aqhi, rain]);
    const group = groups.get(key);
    if (group) group.hours++;
    else groups.set(key, { ...row, point: project(row.temperature, row.aqhi, rain), hours: 1 });
  }
  const marks = [...groups.values()].sort((a, b) => a.point[1] - b.point[1]);
  ctx.fillStyle = "#076d68b8";
  for (const mark of marks) {
    ctx.beginPath(); ctx.arc(...mark.point, Math.min(9, 3 + Math.log2(mark.hours)), 0, Math.PI * 2); ctx.fill();
  }
  canvas.onpointermove = event => {
    const rect = canvas.getBoundingClientRect();
    const x = event.clientX - rect.left, y = event.clientY - rect.top;
    const distance = mark => Math.hypot(mark.point[0] - x, mark.point[1] - y);
    const mark = marks.reduce((nearest, item) => distance(item) <= distance(nearest) ? item : nearest);
    info.hidden = distance(mark) > 13;
    if (info.hidden) return;
    const aqhi = mark.aqhi === 11 ? "10+" : mark.aqhi;
    const details = mark.hours > 1 ? t("overlappingHours", { count: mark.hours }) : time(mark.hour);
    info.textContent = [mark.temperature + " °C", "AQHI " + aqhi, ...(threeAxes ? [mark.rain + " mm"] : []), details].join(" · ");
    info.style.left = Math.max(0, Math.min(x + 9, width - info.offsetWidth)) + "px";
    info.style.top = Math.max(0, y - info.offsetHeight - 8) + "px";
  };
  canvas.onpointerleave = () => { info.hidden = true; };
}

function drawAnalysis(station, air, temperature, rain) {
  const rows = analysisHours(air, temperature, rain);
  const paired = (x, y) => rows.filter(row => Number.isFinite(row[x]) && Number.isFinite(row[y]));
  const tempAir = paired("temperature", "aqhi");
  completeAnalysis = tempAir.filter(row => Number.isFinite(row.rain));
  $("analysis-station").textContent = stationName(station);
  $("complete-hours").textContent = t("completeHours", { count: completeAnalysis.length });
  const results = $("analysis-results").tBodies[0];
  results.replaceChildren();
  for (const [title, x, y, pairs] of [
    ["tempAir", "temperature", "aqhi", tempAir],
    ["rainAir", "rain", "aqhi", paired("rain", "aqhi")],
    ["tempRain", "temperature", "rain", paired("temperature", "rain")],
  ]) {
    const value = spearman(pairs, x, y);
    const row = element("tr");
    const heading = element("th", t(title));
    heading.scope = "row";
    row.append(heading, element("td", value === null ? "—" : value.toFixed(2)), element("td", pairs.length));
    results.append(row);
  }
  drawScatter("temperature-scatter", tempAir);
  drawScatter("weather-scatter", completeAnalysis, true);
}

function drawTrends() {
  if (!data) return;
  const station = data.stations.find(item => item.id === stationId);
  const pair = data.pairs[stationId];
  $("sources").textContent = t("sources", {
    station: stationName(station),
    temperature: locationName(pair.temperature),
    km: pair.temperatureKm.toFixed(1),
    rainfall: locationName(pair.rainfall),
  });
  const air=data.air.filter(row => row.payload.stationId===stationId).map(row => ({
    observedAt:row.observedAt,value:score(row.payload.value),label:row.payload.value,
  }));
  drawChart("air-chart",air,{color:"#076d68",bounds:[1,11],ticks:[1,3,6,8,11],connect:true});
  const weatherSeries = (metric, location, unit) => data.weather.filter(row => row.payload.metric===metric && row.payload.location===location).map(row => ({
    observedAt:row.observedAt, periodStart:row.periodStart, value:row.payload.value, label:row.payload.value+" "+unit,
  }));
  const temperature = weatherSeries("temperature", pair.temperature, "°C");
  drawChart("temp-chart",temperature,{color:"#ac512c",connect:true});
  const rain = weatherSeries("rainfall_max", pair.rainfall, "mm");
  const maxRain = Math.max(1, ...rain.map(row => row.value));
  drawChart("rain-chart", rain, {color:"#3f6fa0", bounds:[0,maxRain], connect:false});
  drawAnalysis(station, air, temperature, rain);
}
select.addEventListener("change", () => selectStation(select.value));
$("analysis-rotation").addEventListener("input", event => {
  $("analysis-angle").value = event.target.value + "°";
  drawScatter("weather-scatter", completeAnalysis, true);
});

function snapshotWindow(snapshot, hours) {
  const start = Date.parse(snapshot.until) - hours * 3600_000;
  const inWindow = row => Date.parse(row.observedAt) >= start;
  return {
    ...snapshot,
    since: new Date(start).toISOString(),
    air: snapshot.air.filter(inWindow),
    weather: snapshot.weather.filter(inWindow),
  };
}

function renderNotice() {
  const timestamp = data?.publishedAt && { time: time(data.publishedAt) };
  let notice = t("loading");
  if (loadFailed) {
    notice = t("retry") + (timestamp ? " " + t("stale", timestamp) : "");
  } else if (data) {
    notice = t("window", { interval: interval(data.since, data.until) });
  }
  $("notice").textContent = notice;
}

function render() {
  renderNotice();
  if (!data) return;
  buildStations();
  drawMap();
  selectStation(stationId);
}

function renderSelectedWindow() {
  if (allData) data = snapshotWindow(allData, Number(hours.value));
  render();
}

async function readData(url, signal) {
  const response = await fetch(url, { signal, cache:"no-cache" });
  if (!response.ok) throw new Error("HTTP " + response.status);
  return response.json();
}

async function load() {
  pending?.abort();
  const controller=new AbortController();
  pending=controller;
  try {
    const payload = await readData(snapshotUrl || "/dashboard/data?hours=720", controller.signal);
    if (controller.signal.aborted) return;
    allData = payload;
    const newest=payload.air.at(-1)?.observedAt;
    latestRows=new Map(payload.air.filter(row => row.observedAt===newest).map(row => [row.payload.stationId,row]));
    loadFailed = false;
    renderSelectedWindow();
  } catch (error) {
    if (controller.signal.aborted || error.name === "AbortError") return;
    loadFailed = true;
    renderNotice();
  }
}
let savedLanguage;
try { savedLanguage = localStorage.getItem("weather-dashboard-language"); } catch {}
applyLanguage(savedLanguage);
$("language").addEventListener("change", event => {
  const language = event.target.value;
  try { localStorage.setItem("weather-dashboard-language", language); } catch {}
  applyLanguage(language);
});
hours.addEventListener("change",renderSelectedWindow);
const header = document.querySelector("header");
new ResizeObserver(() => document.documentElement.style.setProperty("--header-height", header.offsetHeight + "px")).observe(header);
new ResizeObserver(() => { drawMap(); drawTrends(); }).observe(document.querySelector("main"));
setInterval(load,300_000);
load();
</script>
